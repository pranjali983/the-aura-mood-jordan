<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Mood</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --accent: #a29bfe;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: var(--text);
        }

        .app-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            width: 350px;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; }

        .mood-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .mood-btn {
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: none;
            border: none;
            filter: grayscale(0.5);
        }

        .mood-btn:hover { transform: scale(1.4); filter: grayscale(0); }

        .mood-btn.selected { filter: grayscale(0); transform: scale(1.4); }

        #log-btn {
            background: white;
            color: #302b63;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #log-btn:hover { background: var(--accent); color: white; transform: translateY(-3px); }

        .history {
            margin-top: 30px;
            text-align: left;
            font-size: 0.9rem;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Scrollbar styling */
        .history::-webkit-scrollbar { width: 4px; }
        .history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>How are you?</h1>
        
        <div class="mood-options">
            <button class="mood-btn" onclick="selectMood('🤩', this)">🤩</button>
            <button class="mood-btn" onclick="selectMood('😊', this)">😊</button>
            <button class="mood-btn" onclick="selectMood('😐', this)">😐</button>
            <button class="mood-btn" onclick="selectMood('😔', this)">😔</button>
            <button class="mood-btn" onclick="selectMood('😴', this)">😴</button>
        </div>

        <button id="log-btn" onclick="saveMood()">LOG MOMENT</button>

        <div class="history" id="historyList">
            </div>
    </div>

    <script>
        let currentMood = '';
        let logs = JSON.parse(localStorage.getItem('aura_logs')) || [];

        function selectMood(emoji, btn) {
            currentMood = emoji;
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function saveMood() {
            if (!currentMood) return;

            const entry = {
                emoji: currentMood,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString()
            };

            logs.unshift(entry);
            localStorage.setItem('aura_logs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('historyList');
            list.innerHTML = logs.map(log => `
                <div class="history-item">
                    <span>${log.emoji} Logged</span>
                    <span style="opacity:0.5">${log.time}</span>
                </div>
            `).join('');
        }

        renderLogs();
    </script>
</body>
</html>
